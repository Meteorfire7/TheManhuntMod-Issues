name: Feature request
description: Suggest an idea or an improvement
title: "[Suggestion] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it be useful?
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I searched the existing issues and this was not suggested yet
          required: true
